# ── App deployment: left completely idle ──
# No `components:` key — opentelemetry-demo's own defaults deploy all 25
# microservices untouched.

# ── Disable the demo's other 4 bundled backends (you run your own stack) ──
jaeger:
  enabled: false
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false

# ── Collector: fully owned from scratch via alternateConfig ──
opentelemetry-collector:
  mode: daemonset

  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods

    - name: otelcol-storage
      hostPath:
        path: /var/lib/otelcol
        type: DirectoryOrCreate

  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true

    - name: otelcol-storage
      mountPath: /var/lib/otelcol

  serviceAccount:
    create: true
    name: gke-service-account
    annotations: {}

  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources:
          - nodes
          - nodes/proxy
          - nodes/stats
          - nodes/metrics
          - services
          - endpoints
          - pods
          - namespaces
          - configmaps
          - secrets
          - resourcequotas
          - persistentvolumeclaims
          - persistentvolumes
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources:
          - replicasets
          - daemonsets
          - statefulsets
          - deployments
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions"]
        resources:
          - replicasets
        verbs: ["get", "list", "watch"]
        
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  
  presets:
    hostMetrics:
      enabled: false
    kubernetesAttributes:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false
    annotationDiscovery:
      metrics:
        enabled: false
      logs:
        enabled: false
    logsCollection:
      enabled: false

  command:
    extraArgs: []

  alternateConfig:
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log

        exclude:
          - /var/log/pods/kube-system_*/*/*.log
          - /var/log/pods/observability_*/*/*.log
          - /var/log/pods/istio-system_*/*/*.log
          - /var/log/pods/linkerd_*/*/*.log

        start_at: beginning
        storage: file_storage
        include_file_path: true

        operators:
          # Extract namespace/pod/container from log path
          - type: regex_parser
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/'

          - type: move
            from: attributes.namespace
            to: resource["k8s.namespace.name"]

          - type: move
            from: attributes.pod
            to: resource["k8s.pod.name"]

          - type: move
            from: attributes.container
            to: resource["k8s.container.name"]

          # Parse CRI log format
          - type: regex_parser
            parse_from: body
            regex: '^(?P<timestamp>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<partial>[PF])\s+(?P<message>.*)$'

          - type: move
            from: attributes.message
            to: body

          # Parse timestamp
          - type: time_parser
            id: time-parser-k8s
            parse_from: attributes.timestamp
            layout_type: gotime
            layout: '2006-01-02T15:04:05.999999999Z'
            on_error: send_quiet

          # Recombine multiline logs
          - type: recombine
            combine_field: body
            combine_with: ""
            is_last_entry: 'attributes.partial == "F"'
            source_identifier: attributes["log.file.path"]

          # Parse application log level
          - type: regex_parser
            parse_from: body
            regex: '^(?P<level>[A-Z]+):\s+(?P<message>.*)$'

          - type: move
            from: attributes.message
            to: body

          - type: severity_parser
            parse_from: attributes.level

      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          filesystem: {}
          network: {}
          load: {}
          paging: {}
          process: {}

      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            endpoint: ${env:MY_POD_IP}:4318

    processors:
      k8sattributes:
        auth_type: serviceAccount

        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: resource_attribute
                name: k8s.namespace.name

        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.pod.uid
            
      transform/add_kubernetes_service_name:
          log_statements:
            - context: resource
              statements:
                - set(attributes["kubernetes_service_name"], attributes["k8s.container.name"])

      batch: {}

    exporters:
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/prometheus:
        endpoint: http://prometheus-server.observability.svc.cluster.local/api/v1/otlp
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      file_storage:
        directory: /var/lib/otelcol

    service:
      extensions: [health_check, file_storage]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [otlp/tempo, debug]
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [k8sattributes, batch]
          exporters: [otlphttp/prometheus, debug]
        logs:
          receivers: [otlp, filelog]
          processors: [k8sattributes, transform/add_kubernetes_service_name, batch]
          exporters: [otlphttp/loki, debug]

# ── eBPF profiler sub-chart: also disabled by demo default, keep it off ──
otel-ebpf-profiler:
  enabled: false
