mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib

config:

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch: {}

  exporters:
    debug: {}

  service:
    pipelines:
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [debug]
