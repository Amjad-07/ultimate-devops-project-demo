mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.108.0
  
serviceAccount:
  create: true
  name: gke-service-account
  annotations: {}

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources:
        - nodes
        - nodes/proxy
        - nodes/stats
        - nodes/metrics
        - services
        - endpoints
        - pods
        - namespaces
        - configmaps
        - secrets
        - resourcequotas
        - persistentvolumeclaims
        - persistentvolumes
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources:
        - replicasets
        - daemonsets
        - statefulsets
        - deployments
      verbs: ["get", "list", "watch"]
    - apiGroups: ["extensions"]
      resources:
        - replicasets
      verbs: ["get", "list", "watch"]


securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

extraVolumes:
  - name: varlogpods
    hostPath:
      path: /var/log/pods

  - name: otelcol-storage
    hostPath:
      path: /var/lib/otelcol
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: varlogpods
    mountPath: /var/log/pods
    readOnly: true

  - name: otelcol-storage
    mountPath: /var/lib/otelcol

alternateConfig:

  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133

    file_storage:
      directory: /var/lib/otelcol

  receivers:
    filelog:
      include:
        - /var/log/pods/*/*/*.log

      exclude:
        - /var/log/pods/kube-system_*/*/*.log
        - /var/log/pods/observability_*/*/*.log
        - /var/log/pods/istio-system_*/*/*.log
        - /var/log/pods/linkerd_*/*/*.log

      start_at: beginning

      storage: file_storage

      include_file_path: true

      operators:

        # Extract namespace/pod/container from log path
        - type: regex_parser
          parse_from: attributes["log.file.path"]
          regex: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/'

        - type: move
          from: attributes.namespace
          to: resource["k8s.namespace.name"]

        - type: move
          from: attributes.pod
          to: resource["k8s.pod.name"]

        - type: move
          from: attributes.container
          to: resource["k8s.container.name"]

        # Parse CRI log format
        - type: regex_parser
          parse_from: body
          regex: '^(?P<timestamp>\S+)\s+(?P<stream>stdout|stderr)\s+(?P<partial>[PF])\s+(?P<message>.*)$'

        - type: move
          from: attributes.message
          to: body

        # Parse timestamp
        - type: time_parser
          id: time-parser-k8s
          parse_from: attributes.timestamp
          layout_type: gotime
          layout: '2006-01-02T15:04:05.999999999Z'
          on_error: send_quiet

        # Recombine multiline logs
        - type: recombine
          combine_field: body
          combine_with: ""
          is_last_entry: 'attributes.partial == "F"'
          source_identifier: attributes["log.file.path"]

        # Parse application log level
        - type: regex_parser
          parse_from: body
          regex: '^(?P<level>[A-Z]+):\s+(?P<message>.*)$'

        - type: move
          from: attributes.message
          to: body

        - type: severity_parser
          parse_from: attributes.level

  processors:

    ####################################################
    # Kubernetes Metadata Enrichment
    ####################################################
    k8sattributes:
      auth_type: serviceAccount

      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.name
            - from: resource_attribute
              name: k8s.namespace.name

      extract:
        metadata:
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.pod.uid

    ####################################################
    # Remove Health Checks
    ####################################################
    filter/health_logs:
      logs:
        log_record:
          - 'IsMatch(body, "/health")'

    ####################################################
    # Batch
    ####################################################
    batch: {}

  exporters:
    debug:
      verbosity: detailed
    otlphttp/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
      tls:
        insecure : true

  service:

    extensions:
      - health_check
      - file_storage

    pipelines:
      logs:
        receivers:
          - filelog

        processors:
          - k8sattributes
          - filter/health_logs
          - batch

        exporters:
          - debug
          - otlphttp/loki
