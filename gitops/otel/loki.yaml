# -----------------------------------------------------------------------------
# Loki - Learning Configuration (Single Node GKE)
# Chart Version: 6.7.4
# Loki Version : 3.1.0
# -----------------------------------------------------------------------------

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  limits_config:
    retention_period: 168h

    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16

    query_timeout: 120s
    max_query_length: 168h
    split_queries_by_interval: 6h
    max_concurrent_tail_requests: 5

    # ---------------------------------------------------------
    # OTLP Resource Attribute Mapping
    # ---------------------------------------------------------
    otlp_config:
      resource_attributes:
        attributes_config:

          # Indexed labels (Fast LogQL filtering)
          - action: index_label
            attributes:
              - service.name
              - k8s.namespace.name
              - k8s.deployment.name

          # Stored with every log (Not Indexed)
          - action: structured_metadata
            attributes:
              - k8s.pod.name
              - k8s.node.name
              - k8s.pod.uid

deploymentMode: SingleBinary

singleBinary:
  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  persistence:
    enabled: true
    storageClass: standard-rwo
    size: 5Gi

# -----------------------------------------------------------------------------
# Disable Distributed Components
# -----------------------------------------------------------------------------

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# -----------------------------------------------------------------------------
# Disable Memcached
# -----------------------------------------------------------------------------

chunksCache:
  enabled: false

resultsCache:
  enabled: false

# -----------------------------------------------------------------------------
# Disable Gateway
# -----------------------------------------------------------------------------

gateway:
  enabled: false

# -----------------------------------------------------------------------------
# Disable Canary
# -----------------------------------------------------------------------------

lokiCanary:
  enabled: false

# -----------------------------------------------------------------------------
# Disable Monitoring
# -----------------------------------------------------------------------------

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# -----------------------------------------------------------------------------
# Disable Test Pod
# -----------------------------------------------------------------------------

test:
  enabled: false
