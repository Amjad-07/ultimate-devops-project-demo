grafana:
  enabled: false

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

defaultRules:
  create: false

prometheusOperator:
  enabled: true

prometheus:
  enabled: true

  prometheusSpec:

    additionalScrapeConfigs:
      - job_name: "otel-hostmetrics"

        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - observability

        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
            regex: otel-collector-filelog
            action: keep

          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: opentelemetry-collector
            action: keep

          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8889"
            action: keep

          - source_labels: [__address__]
            target_label: __address__

    retention: 7d

    scrapeInterval: 15s

    evaluationInterval: 15s

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
