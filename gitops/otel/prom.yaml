grafana:
  enabled: false

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

defaultRules:
  create: false

prometheusOperator:
  enabled: true

prometheus:
  enabled: true

  service:
    type: LoadBalancer

  additionalRulesForClusterRole:
    - apiGroups: [""]
      resources:
        - nodes/proxy
      verbs:
        - get
        - list
        - watch

  prometheusSpec:

    retention: 7d

    scrapeInterval: 15s

    evaluationInterval: 15s

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    additionalScrapeConfigs:

      ############################################################
      # OTEL Host Metrics
      ############################################################

      - job_name: "otel-hostmetrics"

        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - observability

        relabel_configs:

          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_instance
            regex: otel-collector-filelog
            action: keep

          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: opentelemetry-collector
            action: keep

          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            regex: "8889"
            action: keep

          - source_labels:
              - __address__
            target_label: __address__

      ############################################################
      # Kubernetes cAdvisor
      ############################################################

      - job_name: "kubernetes-cadvisor"

        honor_labels: true

        kubernetes_sd_configs:
          - role: node

        scheme: https

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: false

        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        relabel_configs:

          - action: replace
            target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels:
              - __meta_kubernetes_node_name
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: kubernetes_node

          - action: replace
            target_label: __scheme__
            replacement: https
